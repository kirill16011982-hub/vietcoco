<svg font-family="Arial, Helvetica, sans-serif" height="976" viewbox="0 0 1100 976" width="1100" xmlns="http://www.w3.org/2000/svg"><rect fill="#ffffff" height="976" width="1100" x="0" y="0"></rect><rect fill="#FFFF8C" height="50" stroke="#7a7a10" stroke-width="2" width="200" x="320" y="30"></rect><text fill="#1d2a12" font-size="30" font-weight="700" text-anchor="middle" x="420" y="65">thuật ngữ</text><rect fill="#FFFF8C" height="50" stroke="#7a7a10" stroke-width="2" width="300" x="550" y="30"></rect><text fill="#1d2a12" font-size="30" font-weight="700" text-anchor="middle" x="700" y="65">định nghĩa</text><rect fill="#F8C995" height="50" stroke="#1d2a12" stroke-width="3" width="233.2" x="286.8" y="116"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="403.4" y="148.0">Nhận gáo dừa</text><rect fill="#F8C995" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="110"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="136.0">kiểm tra đầu vào gáo dừa:</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="160.0">độ ẩm, độ sạch, kích cỡ</text><rect fill="#3A7D25" height="50" stroke="#1d2a12" stroke-width="3" width="312.4" x="207.60000000000002" y="192"></rect><text fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle" x="363.8" y="224.0">Cacbon hóa (nhiệt phân)</text><rect fill="#3A7D25" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="186"></rect><text fill="#ffffff" font-size="19" text-anchor="middle" x="815.0" y="212.0">nung gáo dừa không có oxy (400–600 °C);</text><text fill="#ffffff" font-size="19" text-anchor="middle" x="815.0" y="236.0">than thô thu được ~30% khối lượng</text><rect fill="#CFE9B8" height="50" stroke="#1d2a12" stroke-width="3" width="233.2" x="286.8" y="268"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="403.4" y="300.0">Ngưng tụ khí</text><rect fill="#CFE9B8" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="262"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="288.0">làm lạnh khí nhiệt phân thành chất lỏng —</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="312.0">giấm gỗ</text><rect fill="#D3D7A9" height="50" stroke="#1d2a12" stroke-width="3" width="200" x="320" y="344"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="420.0" y="376.0">Khí dùng để sấy</text><rect fill="#D3D7A9" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="338"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="364.0">khí không ngưng tụ được đốt trong đầu đốt</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="388.0">của máy sấy: −40% nhiên liệu mua ngoài</text><rect fill="#C8C8C8" height="50" stroke="#1d2a12" stroke-width="3" width="259.6" x="260.4" y="420"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="390.2" y="452.0">Nghiền và sàng</text><rect fill="#C8C8C8" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="414"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="440.0">nghiền than thô đến 0–3 mm,</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="464.0">tách than vụn (~8%)</text><rect fill="#F8C995" height="50" stroke="#1d2a12" stroke-width="3" width="200" x="320" y="496"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="420.0" y="528.0">Ép</text><rect fill="#F8C995" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="490"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="516.0">ép khối 25×25 mm với chất kết dính</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="540.0">(tinh bột ~5%); hiệu suất ~90%</text><rect fill="#CDE6F7" height="50" stroke="#1d2a12" stroke-width="3" width="200" x="320" y="572"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="420.0" y="604.0">Sấy</text><rect fill="#CDE6F7" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="566"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="592.0">sấy than đến độ ẩm &lt;8%</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="616.0">trong hầm sấy</text><rect fill="#F6C6C6" height="50" stroke="#1d2a12" stroke-width="3" width="200" x="320" y="648"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="420.0" y="680.0">Hoạt hóa</text><rect fill="#F6C6C6" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="642"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="668.0">xử lý than bằng hơi nước ở 800–950 °C —</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="692.0">chất hấp phụ xốp: than hoạt tính</text><rect fill="#E6D3F0" height="50" stroke="#1d2a12" stroke-width="3" width="206.79999999999998" x="313.20000000000005" y="724"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="416.6" y="756.0">Ép viên</text><rect fill="#E6D3F0" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="718"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="744.0">ép than vụn</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="768.0">thành than BBQ</text><rect fill="#FFF59D" height="50" stroke="#1d2a12" stroke-width="3" width="200" x="320" y="800"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="420.0" y="832.0">Đóng gói</text><rect fill="#FFF59D" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="794"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="820.0">hộp 1 kg và thùng carton 20 kg —</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="844.0">xưởng in riêng</text><rect fill="#CFF5CF" height="50" stroke="#1d2a12" stroke-width="3" width="325.59999999999997" x="194.40000000000003" y="876"></rect><text fill="#1d2a12" font-size="21" font-weight="700" text-anchor="middle" x="357.20000000000005" y="908.0">Kiểm soát chất lượng (CoA)</text><rect fill="#CFF5CF" height="62" stroke="#1d2a12" stroke-width="3" width="530" x="550" y="870"></rect><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="896.0">phiếu kiểm nghiệm lô: độ tro,</text><text fill="#1d2a12" font-size="19" text-anchor="middle" x="815.0" y="920.0">độ ẩm, thời gian cháy, nhiệt trị</text><rect fill="#3A7D25" height="290" stroke="#1d2a12" stroke-width="1.5" width="46" x="40" y="110"></rect><text dominant-baseline="middle" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle" transform="rotate(-90 63.0 255.0)" x="63.0" y="255.0">Chế biến gáo dừa</text><path d="M118,114 C104,114 112,249.0 100,255.0 C112,261.0 104,396 118,396" fill="none" stroke="#1d2a12" stroke-width="1.6"></path><rect fill="#F8C995" height="214" stroke="#1d2a12" stroke-width="1.5" width="46" x="40" y="414"></rect><text dominant-baseline="middle" fill="#1d2a12" font-size="20" font-weight="700" text-anchor="middle" transform="rotate(-90 63.0 521.0)" x="63.0" y="521.0">Than shisha</text><path d="M118,418 C104,418 112,515.0 100,521.0 C112,527.0 104,624 118,624" fill="none" stroke="#1d2a12" stroke-width="1.6"></path><rect fill="#F6C6C6" height="138" stroke="#1d2a12" stroke-width="1.5" width="46" x="40" y="642"></rect><text dominant-baseline="middle" fill="#1d2a12" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 63.0 711.0)" x="63.0" y="711.0">Sản phẩm mới</text><path d="M118,646 C104,646 112,705.0 100,711.0 C112,717.0 104,776 118,776" fill="none" stroke="#1d2a12" stroke-width="1.6"></path><rect fill="#FFF59D" height="138" stroke="#1d2a12" stroke-width="1.5" width="46" x="40" y="794"></rect><text dominant-baseline="middle" fill="#1d2a12" font-size="20" font-weight="700" text-anchor="middle" transform="rotate(-90 63.0 863.0)" x="63.0" y="863.0">Thành phẩm</text><path d="M118,798 C104,798 112,857.0 100,863.0 C112,869.0 104,928 118,928" fill="none" stroke="#1d2a12" stroke-width="1.6"></path></svg>