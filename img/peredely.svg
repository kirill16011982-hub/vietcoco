<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="976" viewBox="0 0 1100 976" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1100" height="976" fill="#ffffff"/><rect x="320" y="30" width="200" height="50" fill="#FFFF8C" stroke="#7a7a10" stroke-width="2"/><text x="420" y="65" font-size="30" font-weight="700" text-anchor="middle" fill="#1d2a12">термин</text><rect x="550" y="30" width="300" height="50" fill="#FFFF8C" stroke="#7a7a10" stroke-width="2"/><text x="700" y="65" font-size="30" font-weight="700" text-anchor="middle" fill="#1d2a12">определение</text><rect x="286.8" y="116" width="233.2" height="50" fill="#F8C995" stroke="#1d2a12" stroke-width="3"/><text x="403.4" y="148.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Приёмка скорлупы</text><rect x="550" y="110" width="530" height="62" fill="#F8C995" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="136.0" font-size="19" text-anchor="middle" fill="#1d2a12">входной контроль кокосовой скорлупы:</text><text x="815.0" y="160.0" font-size="19" text-anchor="middle" fill="#1d2a12">влажность, чистота, фракция</text><rect x="207.60000000000002" y="192" width="312.4" height="50" fill="#3A7D25" stroke="#1d2a12" stroke-width="3"/><text x="363.8" y="224.0" font-size="21" font-weight="700" text-anchor="middle" fill="#ffffff">Карбонизация (пиролиз)</text><rect x="550" y="186" width="530" height="62" fill="#3A7D25" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="212.0" font-size="19" text-anchor="middle" fill="#ffffff">нагрев скорлупы без доступа кислорода (400–600 °C);</text><text x="815.0" y="236.0" font-size="19" text-anchor="middle" fill="#ffffff">выход угля-сырца ~30% массы</text><rect x="286.8" y="268" width="233.2" height="50" fill="#CFE9B8" stroke="#1d2a12" stroke-width="3"/><text x="403.4" y="300.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Конденсация газа</text><rect x="550" y="262" width="530" height="62" fill="#CFE9B8" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="288.0" font-size="19" text-anchor="middle" fill="#1d2a12">охлаждение пиролизного газа в жидкость —</text><text x="815.0" y="312.0" font-size="19" text-anchor="middle" fill="#1d2a12">древесный уксус</text><rect x="320" y="344" width="200" height="50" fill="#D3D7A9" stroke="#1d2a12" stroke-width="3"/><text x="420.0" y="376.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Газ на сушку</text><rect x="550" y="338" width="530" height="62" fill="#D3D7A9" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="364.0" font-size="19" text-anchor="middle" fill="#1d2a12">несконденсированный газ сжигается в горелках</text><text x="815.0" y="388.0" font-size="19" text-anchor="middle" fill="#1d2a12">сушилок: −40% покупного топлива</text><rect x="260.4" y="420" width="259.6" height="50" fill="#C8C8C8" stroke="#1d2a12" stroke-width="3"/><text x="390.2" y="452.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Дробление и рассев</text><rect x="550" y="414" width="530" height="62" fill="#C8C8C8" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="440.0" font-size="19" text-anchor="middle" fill="#1d2a12">измельчение угля-сырца до 0–3 мм,</text><text x="815.0" y="464.0" font-size="19" text-anchor="middle" fill="#1d2a12">отделение мелочи (~8%)</text><rect x="320" y="496" width="200" height="50" fill="#F8C995" stroke="#1d2a12" stroke-width="3"/><text x="420.0" y="528.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Прессование</text><rect x="550" y="490" width="530" height="62" fill="#F8C995" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="516.0" font-size="19" text-anchor="middle" fill="#1d2a12">формование кубиков 25×25 мм со связующим</text><text x="815.0" y="540.0" font-size="19" text-anchor="middle" fill="#1d2a12">(крахмал ~5%); выход ~90%</text><rect x="320" y="572" width="200" height="50" fill="#CDE6F7" stroke="#1d2a12" stroke-width="3"/><text x="420.0" y="604.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Сушка</text><rect x="550" y="566" width="530" height="62" fill="#CDE6F7" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="592.0" font-size="19" text-anchor="middle" fill="#1d2a12">доведение кубиков до влажности &lt;8%</text><text x="815.0" y="616.0" font-size="19" text-anchor="middle" fill="#1d2a12">в туннельных сушилках</text><rect x="320" y="648" width="200" height="50" fill="#F6C6C6" stroke="#1d2a12" stroke-width="3"/><text x="420.0" y="680.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Активация</text><rect x="550" y="642" width="530" height="62" fill="#F6C6C6" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="668.0" font-size="19" text-anchor="middle" fill="#1d2a12">обработка угля паром при 800–950 °C —</text><text x="815.0" y="692.0" font-size="19" text-anchor="middle" fill="#1d2a12">пористый сорбент: активированный уголь</text><rect x="313.20000000000005" y="724" width="206.79999999999998" height="50" fill="#E6D3F0" stroke="#1d2a12" stroke-width="3"/><text x="416.6" y="756.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Брикетирование</text><rect x="550" y="718" width="530" height="62" fill="#E6D3F0" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="744.0" font-size="19" text-anchor="middle" fill="#1d2a12">прессование угольной мелочи</text><text x="815.0" y="768.0" font-size="19" text-anchor="middle" fill="#1d2a12">в брикеты для барбекю</text><rect x="320" y="800" width="200" height="50" fill="#FFF59D" stroke="#1d2a12" stroke-width="3"/><text x="420.0" y="832.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Упаковка</text><rect x="550" y="794" width="530" height="62" fill="#FFF59D" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="820.0" font-size="19" text-anchor="middle" fill="#1d2a12">коробки 1 кг и гофрокороба 20 кг —</text><text x="815.0" y="844.0" font-size="19" text-anchor="middle" fill="#1d2a12">собственная типография</text><rect x="194.40000000000003" y="876" width="325.59999999999997" height="50" fill="#CFF5CF" stroke="#1d2a12" stroke-width="3"/><text x="357.20000000000005" y="908.0" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2a12">Контроль качества (CoA)</text><rect x="550" y="870" width="530" height="62" fill="#CFF5CF" stroke="#1d2a12" stroke-width="3"/><text x="815.0" y="896.0" font-size="19" text-anchor="middle" fill="#1d2a12">лабораторный протокол партии: зольность,</text><text x="815.0" y="920.0" font-size="19" text-anchor="middle" fill="#1d2a12">влажность, время горения, теплота сгорания</text><rect x="40" y="110" width="46" height="290" fill="#3A7D25" stroke="#1d2a12" stroke-width="1.5"/><text x="63.0" y="255.0" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" transform="rotate(-90 63.0 255.0)">Переработка скорлупы</text><path d="M118,114 C104,114 112,249.0 100,255.0 C112,261.0 104,396 118,396" fill="none" stroke="#1d2a12" stroke-width="1.6"/><rect x="40" y="414" width="46" height="214" fill="#F8C995" stroke="#1d2a12" stroke-width="1.5"/><text x="63.0" y="521.0" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a12" transform="rotate(-90 63.0 521.0)">Кальянный уголь</text><path d="M118,418 C104,418 112,515.0 100,521.0 C112,527.0 104,624 118,624" fill="none" stroke="#1d2a12" stroke-width="1.6"/><rect x="40" y="642" width="46" height="138" fill="#F6C6C6" stroke="#1d2a12" stroke-width="1.5"/><text x="63.0" y="711.0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a12" transform="rotate(-90 63.0 711.0)">Новые продукты</text><path d="M118,646 C104,646 112,705.0 100,711.0 C112,717.0 104,776 118,776" fill="none" stroke="#1d2a12" stroke-width="1.6"/><rect x="40" y="794" width="46" height="138" fill="#FFF59D" stroke="#1d2a12" stroke-width="1.5"/><text x="63.0" y="863.0" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1d2a12" transform="rotate(-90 63.0 863.0)">Выпуск</text><path d="M118,798 C104,798 112,857.0 100,863.0 C112,869.0 104,928 118,928" fill="none" stroke="#1d2a12" stroke-width="1.6"/></svg>